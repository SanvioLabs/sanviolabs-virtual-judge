name: CI

# Everything here runs against mocked providers. MOCK_EXTERNALS=true swaps the
# OpenRouter and ElevenLabs calls for canned responses, so CI needs no API keys
# and spends nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          MOCK_EXTERNALS: "true"
        run: uv run pytest tests/ -v

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and its browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts the server itself, with MOCK_EXTERNALS set.
      - name: Run Playwright
        run: npx playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
