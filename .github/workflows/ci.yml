name: CI

# Everything here runs against mocked providers. MOCK_EXTERNALS=true swaps the
# OpenRouter and ElevenLabs calls for canned responses, so CI needs no API keys
# and spends nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The frontend went unlinted while the Python half was gated from day
      # one, and that is the half that renders untrusted text into a browser.
      - name: ESLint
        run: |
          npm ci
          npx eslint .

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  pytest:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          MOCK_EXTERNALS: "true"
        run: uv run pytest tests/ -v

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Playwright and its browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts the server itself, with MOCK_EXTERNALS set.
      - name: Run Playwright
        run: npx playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
