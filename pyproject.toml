[project]
name = "virtual-judge"
version = "0.1.0"
description = "AI-powered hackathon judging tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "openai==1.82.0",
    "elevenlabs==1.56.0",
    "pyyaml==6.0.2",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned rather than left to the default, which pytest-asyncio warns about on
# every run and intends to change.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
