# Local gate before anything reaches a public repository. CI catches the same
# things, but it catches them after the commit exists, and a secret that has
# been pushed is a rotation event whether or not the push was reverted.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # The three directories that must never be committed hold recordings,
      # the event database, and export bundles. .gitignore covers them; this
      # is the second lock on the same door.
      - id: check-case-conflict
